name: ecommerce-mvp

x-pg-health: &pg-health
  interval: 5s
  timeout: 3s
  retries: 10

x-mongo-health: &mongo-health
  test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  # =============== API GATEWAY + REDIS ===============
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      AUTH_URL: http://auth-service:3001
      CUSTOMER_URL: http://customer-service:3002
      PRODUCT_URL: http://product-service:3003
      ORDER_URL: http://order-service:3004
      SHIPMENT_URL: http://shipment-service:3005
      HEALTH_SERVICES: auth,customer,product,order,shipment
      RATE_LIMIT: 100
      LOGIN_RATE_LIMIT: 10
      CACHE_TTL: 60
    ports: [ "8080:8080" ] # CỔNG DUY NHẤT mở ra máy host
    depends_on:
      redis: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      customer-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      order-service: { condition: service_healthy }
      shipment-service: { condition: service_healthy }

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes: [ redis-data:/data ]
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # =============== AUTH ===============
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: auth-db
      DB_PORT: 5432
      DB_USER: auth_db
      DB_PASSWORD: auth_db123
      DB_NAME: auth_db
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      KAFKA_BROKERS: kafka:9092
      CUSTOMER_URL: http://customer-service:3002
    depends_on:
      auth-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auth_db
      POSTGRES_PASSWORD: auth_db123
      POSTGRES_DB: auth_db
    volumes: [ auth-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${AUTH_DB_NAME}" ]
      <<: *pg-health

  # =============== CUSTOMER ===============
  customer-service:
    build:
      context: .
      dockerfile: services/customer-service/Dockerfile
    container_name: customer-service
    restart: unless-stopped
    environment:
      PORT: 3002
      GRPC_PORT: 50052
      DB_HOST: customer-db
      DB_PORT: 5432
      DB_USER: customer_db
      DB_PASSWORD: customer_db123
      DB_NAME: customer_db
      KAFKA_BROKERS: kafka:9092
    depends_on:
      customer-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3002/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  customer-db:
    image: postgres:16-alpine
    container_name: customer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: customer_db
      POSTGRES_PASSWORD: customer_db123
      POSTGRES_DB: customer_db
    volumes: [ customer-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${CUSTOMER_DB_NAME}" ]
      <<: *pg-health

  # =============== PRODUCT ===============
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: product-service
    restart: unless-stopped
    environment:
      PORT: 3003
      GRPC_PORT: 50053
      MONGO_URI: mongodb://product_db:product_db123@product-db:27017/product_db?authSource=admin
    depends_on:
      product-db: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3003/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  product-db:
    image: mongo:7
    container_name: product-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: product_db
      MONGO_INITDB_ROOT_PASSWORD: product_db123
      MONGO_INITDB_DATABASE: product_db
    volumes: [ product-db-data:/data/db ]
    healthcheck: *mongo-health

  # =============== ORDER ===============
  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: 3004
      DB_HOST: order-db
      DB_PORT: 5432
      DB_USER: order_db
      DB_PASSWORD: order_db123
      DB_NAME: order_db
      CUSTOMER_GRPC: customer-service:50052
      PRODUCT_GRPC: product-service:50053
      KAFKA_BROKERS: kafka:9092
    depends_on:
      order-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
      customer-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3004/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  order-db:
    image: postgres:16-alpine
    container_name: order-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: order_db
      POSTGRES_PASSWORD: order_db123
      POSTGRES_DB: order_db
    volumes: [ order-db-data:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${ORDER_DB_NAME}" ]
      <<: *pg-health

  # =============== SHIPMENT ===============
  shipment-service:
    build: ./services/shipment-service
    container_name: shipment-service
    restart: unless-stopped
    environment:
      PORT: 3005
      MONGO_URI: mongodb://shipment_db:shipment_db123@shipment-db:27017/shipment_db?authSource=admin
      KAFKA_BROKERS: kafka:9092
    depends_on:
      shipment-db: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3005/health || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  shipment-db:
    image: mongo:7
    container_name: shipment-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: shipment_db
      MONGO_INITDB_ROOT_PASSWORD: shipment_db123
      MONGO_INITDB_DATABASE: shipment_db
    volumes: [ shipment-db-data:/data/db ]
    healthcheck: *mongo-health

  # =============== KAFKA (KRaft, 1 node) ===============
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes: [ kafka-data:/var/lib/kafka/data ]
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  auth-db-data:
  customer-db-data:
  order-db-data:
  product-db-data:
  shipment-db-data:
  redis-data:
  kafka-data:
